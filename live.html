<style>
:root{--bg:#080a10;--panel:#11141d;--line:#282e3d;--text:#eef1f8;--muted:#939caf;--a:#8b5cf6;--a2:#5eead4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 30% -10%,#241640 0,#0b0d14 38%,#07090e 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.top{height:62px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 18px;background:#090b12e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{font-weight:850}.brand b{color:#a78bfa}.nav{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid var(--line);background:#151924;color:var(--text);border-radius:10px;padding:9px 13px}.btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border-color:#8b5cf6}.btn.ghost{background:transparent}.shell{max-width:1320px;margin:auto;padding:22px}.hero{padding:32px 4px 18px}.hero h1{font-size:clamp(30px,5vw,58px);line-height:1.03;margin:0 0 12px;letter-spacing:-1.8px}.hero p{color:var(--muted);max-width:720px;font-size:17px;line-height:1.55}.tag{display:inline-flex;border:1px solid #4c3a75;background:#241839;color:#c4b5fd;padding:4px 8px;border-radius:999px;font-size:11px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;background:#10131b;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:linear-gradient(180deg,#151925,#0f121a);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 14px 38px #0004}.cover{height:138px;background:radial-gradient(circle at 30% 20%,#7c3aed88,#182036 45%,#0d111a);display:flex;align-items:flex-end;padding:14px;font-size:38px}.body{padding:15px}.card h3{margin:9px 0 7px}.card p{color:var(--muted);font-size:13px;line-height:1.45;min-height:57px}.meta{display:flex;gap:12px;color:#7f899f;font-size:12px;margin:11px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;max-width:1400px;margin:auto;padding:14px}.story{min-height:calc(100vh - 90px);display:flex;flex-direction:column;background:#0d1018;border:1px solid var(--line);border-radius:16px;overflow:hidden}.storyhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.sub,.status{font-size:12px;color:var(--muted)}.good{color:#5eead4}.warn{color:#fbbf24}.feed{padding:18px;flex:1;overflow:auto;max-height:calc(100vh - 235px)}.turn{padding:14px 15px;margin:0 0 13px;border-radius:13px;line-height:1.58;white-space:pre-wrap}.turn.player{background:#17132a;border:1px solid #38265b}.turn.gm{background:#121722;border:1px solid #222b3c}.who{font-size:11px;text-transform:uppercase;color:#9ca3b8;font-weight:800;letter-spacing:.8px;margin-bottom:7px}.composer{border-top:1px solid var(--line);padding:12px;background:#0b0e15}.composer textarea{width:100%;min-height:76px;max-height:180px;resize:vertical;background:#141822;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px}.composerbar{display:flex;gap:8px;align-items:center;margin-top:8px}.composerbar select{background:#141822;border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px}.send{margin-left:auto}.side{display:flex;flex-direction:column;gap:12px}.panel{background:#10131b;border:1px solid var(--line);border-radius:15px;padding:14px}.panel h3{margin:0 0 11px;font-size:14px}.kv{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:13px;padding:6px 0;border-bottom:1px solid #202532}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.bar{height:7px;background:#242938;border-radius:6px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#5eead4)}.pill{display:inline-flex;margin:3px 3px 0 0;padding:5px 7px;background:#171c27;border:1px solid #293043;border-radius:8px;font-size:12px}.modal{position:fixed;inset:0;z-index:50;background:#05070bbd;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:#11151e;border:1px solid #343b4d;border-radius:18px;padding:20px}.dialog h2{margin-top:0}.field{margin:13px 0}.field label{display:block;color:#aab2c3;font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0b0e15;border:1px solid var(--line);color:#fff;padding:10px;border-radius:10px}.field textarea{min-height:95px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mem{border:1px solid var(--line);padding:10px;border-radius:10px;margin:8px 0}.mem small{color:#8e98ac}.empty{color:var(--muted);text-align:center;padding:30px}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:7px}.side{display:grid;grid-template-columns:1fr 1fr}.feed{max-height:none;min-height:52vh}.top{padding:0 10px}.hideM{display:none}}@media(max-width:600px){.shell{padding:14px}.hero{padding-top:18px}.side{grid-template-columns:1fr}.row{grid-template-columns:1fr}.btn{padding:9px 10px}.brand{font-size:14px}.story{border-radius:12px}.layout{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style></head>
<body><header class="top"><div class="brand">∞ <b>Infinite Realms</b> Max</div><div id="aiStatus" class="status"></div><nav class="nav"><button class="btn ghost hideM" onclick="home()">Discover</button><button class="btn ghost" onclick="showMemory()">Memory</button><button class="btn primary" onclick="openCreator()">+ Create</button></nav></header><main id="view"></main><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
var STORE='irmax-save-v2';
var samples=[
{id:'hollow-star',title:'Path of the Hollow Star',genre:'Cultivation',icon:'⚔️',desc:'A cultivation sandbox where sect politics, breakthroughs, rivals, artifacts and consequences persist.',plays:18420,rating:4.8,premise:'You are an Outer Sect disciple of Azure Sect. During your spirit-root examination, the ancient testing pillar goes completely dark.',playerName:'Sayal',role:'Outer Sect Disciple',setting:'Azure Sect — Testing Plaza',tone:'Cinematic progression fantasy with danger, strategy and earned power.',rules:'Never control the player. Power must be earned. Rivals remember humiliation. Breakthroughs require conditions. The world continues without the player.',cards:[['World','A vast cultivation world of sects, dynasties, forbidden zones, spirit beasts and ancient inheritances.'],['Progression','Cultivation is earned through resources, insight, training and dangerous breakthroughs. No free realm jumps.'],['Combat','Outcomes respect cultivation gap, technique quality, preparation, injuries and real dice when rolled.'],['AI Instructions','Treat state and memory as canon. NPCs pursue their own goals. Reuse established characters and consequences.']]},
{id:'neon-noir',title:'Neon City Detective',genre:'Detective',icon:'🕵️',desc:'Solve a conspiracy in a rain-soaked megacity where witnesses lie and evidence persists.',plays:9230,rating:4.7,premise:'A famous synthetic-memory designer is found dead inside a locked penthouse.',playerName:'Alex',role:'Independent Investigator',setting:'Meridian City',tone:'Noir, grounded mystery, clever clues and morally gray characters.',rules:'Mysteries must have coherent solutions. Clues cannot retroactively change merely to defeat the player.',cards:[['Mystery','The core case has an internally consistent culprit, motive and evidence trail.'],['NPCs','Witnesses can lie, omit facts, panic or pursue conflicting agendas.']]},
{id:'afterfall',title:'Afterfall Survival',genre:'Survival',icon:'☣️',desc:'Build alliances, scavenge, manage injuries and survive a collapsing region.',plays:12050,rating:4.6,premise:'The emergency broadcasts stopped three days ago. Your shelter has food for four more nights.',playerName:'Morgan',role:'Survivor',setting:'Abandoned Lakeside District',tone:'Tense grounded survival with scarce resources.',rules:'Resources matter. Injuries matter. Do not invent convenient supplies.',cards:[['Survival','Food, water, medicine, shelter and trust are meaningful constraints.']]},
{id:'starbound',title:'Starbound Exile',genre:'Sci-Fi',icon:'🚀',desc:'Command a damaged ship beyond mapped space while your crew questions your past.',plays:7680,rating:4.7,premise:'Your ship wakes you early from cryosleep after receiving a signal from a star that should not exist.',playerName:'Rin',role:'Acting Captain',setting:'Uncharted Helios Reach',tone:'Epic science fiction with mystery and crew drama.',rules:'Technology follows established limits. Crew members have persistent relationships.',cards:[['Ship','The vessel has finite fuel, damage, supplies and modules.'],['Crew','Crew relationships and competence affect outcomes.']]}
];
function baseState(g){return{location:g.setting||'Unknown',realm:g.genre==='Cultivation'?'Body Tempering — Stage 1':'Level 1',hp:{current:100,max:100},qi:{current:g.genre==='Cultivation'?80:20,max:100},gold:45,xp:0,inventory:g.genre==='Cultivation'?[{name:'Outer Sect Token',qty:1},{name:'Low-grade Spirit Stone',qty:3}]:[{name:'Field Kit',qty:1}],quests:[{title:'Follow the first lead',description:'Discover what the opening event means.',status:'active'}],relationships:{}}}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{games:[],runs:{}}}catch(e){return{games:[],runs:{}}}}function save(){localStorage.setItem(STORE,JSON.stringify(db))}
var db=load(),current=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function fmt(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
async function api(path,b){var r=await fetch(path,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function allGames(){return samples.concat(db.games)}function findGame(id){return allGames().find(function(g){return g.id===id})}
async function boot(){try{var h=await api('/api/health');document.getElementById('aiStatus').innerHTML=h.ai==='openrouter'?'<span class="good">● Free AI</span>':'<span class="warn">● Demo AI</span>'}catch(e){}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){})}
function home(){current=null;var genres=[...new Set(allGames().map(function(g){return g.genre}))];document.getElementById('view').innerHTML='<div class="shell"><section class="hero"><span class="tag">AI INTERACTIVE WORLDS</span><h1>Choose a world.<br>Change everything.</h1><p>Free-form adventures with persistent state, campaign cards, long-term memory, real server-side dice and local saves.</p></section><div class="filters"><input id="q" class="search" placeholder="Search games, worlds, genres…" oninput="renderGames()"><select id="genre" class="btn" onchange="renderGames()"><option>All genres</option>'+genres.map(function(x){return'<option>'+esc(x)+'</option>'}).join('')+'</select></div><div id="games" class="grid"></div></div>';renderGames()}
function renderGames(){var q=(document.getElementById('q').value||'').toLowerCase(),ge=document.getElementById('genre').value,list=allGames().filter(function(g){return(ge==='All genres'||g.genre===ge)&&(!q||JSON.stringify(g).toLowerCase().includes(q))});document.getElementById('games').innerHTML=list.map(function(g){return'<article class="card"><div class="cover">'+(g.icon||'✨')+'</div><div class="body"><span class="tag">'+esc(g.genre)+'</span><h3>'+esc(g.title)+'</h3><p>'+esc(g.desc||g.premise)+'</p><div class="meta"><span>▶ '+Number(g.plays||0).toLocaleString()+'</span><span>★ '+(g.rating||'New')+'</span></div><button class="btn primary" style="width:100%" onclick="play(\''+g.id+'\')">Play</button></div></article>'}).join('')||'<div class="empty">No worlds found.</div>'}
function play(id){var g=findGame(id);if(!g)return;var run=db.runs[id];if(!run){run={state:baseState(g),turns:[{who:'gm',text:g.premise+'\n\nWhat do you do?'}],memories:[],checkpoints:[]};db.runs[id]=run;save()}current={g:g,run:run};renderPlay()}
function renderPlay(){var g=current.g,run=current.run,s=run.state,hp=Math.max(0,Math.min(100,s.hp.current/s.hp.max*100)),qi=Math.max(0,Math.min(100,s.qi.current/s.qi.max*100));var turns=run.turns.map(function(t){return'<div class="turn '+(t.who==='player'?'player':'gm')+'"><div class="who">'+(t.who==='player'?'You':'Game Master')+'</div>'+fmt(t.text)+'</div>'}).join('');var inv=s.inventory.length?s.inventory.map(function(i){return'<span class="pill">'+esc(i.name)+' ×'+i.qty+'</span>'}).join(''):'<span class="status">Empty</span>';var qs=s.quests.map(function(q){return'<div class="mem"><b>'+esc(q.title)+'</b><br><small>'+esc(q.status)+'</small></div>'}).join('');document.getElementById('view').innerHTML='<div class="layout"><section class="story"><div class="storyhead"><button class="btn ghost" onclick="home()">←</button><div><b>'+esc(g.title)+'</b><div class="sub">'+esc(g.genre)+' · '+esc(s.location)+'</div></div><button class="btn ghost" style="margin-left:auto" onclick="showCards()">Cards</button></div><div class="feed" id="feed">'+turns+'</div><div class="composer"><textarea id="msg" placeholder="What do you do? You can type anything…"></textarea><div class="composerbar"><select id="mode"><option>Do</option><option>Say</option><option>Story</option></select><button class="btn" onclick="roll()">🎲 Roll</button><button class="btn" onclick="checkpoint()">◇ Save</button><button id="send" class="btn primary send" onclick="sendTurn()">Send</button></div></div></section><aside class="side"><div class="panel"><h3>'+esc(g.playerName||'Character')+'</h3><div class="kv"><span>Role</span><b>'+esc(g.role||'Adventurer')+'</b></div><div class="kv"><span>Realm / Level</span><b>'+esc(s.realm)+'</b></div><div class="kv"><span>HP</span><b>'+s.hp.current+'/'+s.hp.max+'</b></div><div class="bar"><div class="fill" style="width:'+hp+'%"></div></div><div class="kv"><span>Qi / Energy</span><b>'+s.qi.current+'/'+s.qi.max+'</b></div><div class="bar"><div class="fill" style="width:'+qi+'%"></div></div><div class="kv"><span>Gold</span><b>'+s.gold+'</b></div><div class="kv"><span>XP</span><b>'+s.xp+'</b></div></div><div class="panel"><h3>Inventory</h3>'+inv+'</div><div class="panel"><h3>Quests</h3>'+qs+'</div><div class="panel"><h3>Long-term memory</h3><div class="kv"><span>Facts</span><b>'+run.memories.length+'</b></div><button class="btn" style="width:100%;margin-top:8px" onclick="showMemory()">Inspect memory</button></div></aside></div>';setTimeout(function(){var f=document.getElementById('feed');if(f)f.scrollTop=f.scrollHeight},0)}
function getPath(o,p){return p.split('.').reduce(function(x,k){return x&&x[k]},o)}function setPath(o,p,v){var a=p.split('.'),x=o;for(var i=0;i<a.length-1;i++)x=x[a[i]];x[a[a.length-1]]=v}
function apply(ch){var s=current.run.state;(ch||[]).forEach(function(c){if(c.type==='stat'){var old=Number(getPath(s,c.key)||0);setPath(s,c.key,c.op==='set'?c.value:old+c.value);if(c.key==='hp.current')s.hp.current=Math.max(0,Math.min(s.hp.max,s.hp.current));if(c.key==='qi.current')s.qi.current=Math.max(0,Math.min(s.qi.max,s.qi.current))}if(c.type==='inventory_add'){var x=s.inventory.find(function(i){return i.name.toLowerCase()===c.item.toLowerCase()});if(x)x.qty+=c.qty;else s.inventory.push({name:c.item,qty:c.qty})}if(c.type==='inventory_remove'){var y=s.inventory.find(function(i){return i.name.toLowerCase()===c.item.toLowerCase()});if(y)y.qty-=c.qty;s.inventory=s.inventory.filter(function(i){return i.qty>0})}if(c.type==='relationship'){var v=s.relationships[c.entity]||0;s.relationships[c.entity]=c.op==='set'?c.value:v+c.value}if(c.type==='quest_add'&&!s.quests.some(function(q){return q.title===c.title}))s.quests.push({title:c.title,description:c.description,status:'active'});if(c.type==='quest_status'){var q=s.quests.find(function(z){return z.title===c.title});if(q)q.status=c.status}})}
async function sendTurn(){var el=document.getElementById('msg'),raw=el.value.trim();if(!raw)return;var mode=document.getElementById('mode').value,message=mode==='Say'?'I say: "'+raw+'"':mode==='Story'?'Story direction: '+raw:raw;current.run.turns.push({who:'player',text:message});el.value='';renderPlay();try{var out=await api('/api/story',{message:message,game:current.g,state:current.run.state,memories:current.run.memories,recent:current.run.turns.slice(-12)});current.run.turns.push({who:'gm',text:out.narration});apply(out.stateChanges);(out.memories||[]).forEach(function(m){if(!current.run.memories.some(function(x){return x.text===m.text}))current.run.memories.push({id:String(Date.now()+Math.random()),text:m.text,importance:m.importance})});current.run.memories=current.run.memories.slice(-150);db.runs[current.g.id]=current.run;save()}catch(e){current.run.turns.push({who:'gm',text:'Narrator error: '+e.message})}renderPlay()}
async function roll(){var e=prompt('Dice expression','1d20');if(!e)return;try{var r=await api('/api/roll',{expression:e});alert(r.expression+'\nRolls: '+r.rolls.join(', ')+'\nTotal: '+r.total)}catch(x){alert(x.message)}}
function checkpoint(){var label=prompt('Name this checkpoint','Checkpoint '+(current.run.checkpoints.length+1));if(!label)return;current.run.checkpoints.push({label:label,at:Date.now(),state:JSON.parse(JSON.stringify(current.run.state)),turns:JSON.parse(JSON.stringify(current.run.turns)),memories:JSON.parse(JSON.stringify(current.run.memories))});save();alert('Checkpoint saved on this browser.')}
function modal(h){document.getElementById('dialog').innerHTML=h;document.getElementById('modal').classList.add('on')}function closeModal(){document.getElementById('modal').classList.remove('on')}
function showCards(){var g=current.g;modal('<h2>Campaign Cards</h2><p class="status">World facts and creator instructions given to the narrator.</p>'+(g.cards||[]).map(function(c){return'<div class="mem"><b>'+esc(c[0])+'</b><p>'+esc(c[1])+'</p></div>'}).join('')+'<div class="mem"><b>Creator Instructions</b><p>'+esc(g.rules||'')+'</p></div><button class="btn" onclick="closeModal()">Close</button>')}
function showMemory(){if(!current){modal('<h2>Memory</h2><p class="status">Open a game first.</p><button class="btn" onclick="closeModal()">Close</button>');return}var m=current.run.memories;modal('<h2>Memory Inspector</h2><p class="status">Correct, add or remove durable facts.</p>'+(m.length?m.map(function(x,i){return'<div class="mem"><small>Importance '+(x.importance||50)+'</small><div>'+esc(x.text)+'</div><button class="btn ghost" onclick="editMem('+i+')">Edit</button><button class="btn ghost" onclick="delMem('+i+')">Delete</button></div>'}).join(''):'<div class="empty">No durable memories yet.</div>')+'<button class="btn primary" onclick="addMem()">+ Add memory</button> <button class="btn" onclick="closeModal()">Done</button>')}
function editMem(i){var x=current.run.memories[i],v=prompt('Edit memory',x.text);if(v!==null){x.text=v.trim();save();showMemory()}}function delMem(i){current.run.memories.splice(i,1);save();showMemory()}function addMem(){var v=prompt('Permanent fact to remember');if(v){current.run.memories.push({id:String(Date.now()),text:v,importance:90});save();showMemory()}}
function openCreator(){modal('<h2>Create an Adventure</h2><div class="row"><div class="field"><label>Title</label><input id="ct" value="My New Realm"></div><div class="field"><label>Genre</label><select id="cg"><option>Cultivation</option><option>Fantasy</option><option>Sci-Fi</option><option>Horror</option><option>Detective</option><option>Survival</option><option>Isekai</option><option>Tycoon</option><option>Cozy</option><option>Sandbox</option></select></div></div><div class="field"><label>Premise / opening</label><textarea id="cp">I wake in a world where power has a price, and someone already knows my name.</textarea></div><div class="row"><div class="field"><label>Character</label><input id="cn" value="Sayal"></div><div class="field"><label>Role</label><input id="cr" value="Unknown Wanderer"></div></div><div class="field"><label>Tone</label><input id="co" value="Immersive, cinematic, character-driven, dangerous"></div><div class="field"><label>Creator Instructions</label><textarea id="ci">Never control my decisions. Remember consequences. Make victories earned. NPCs have independent motives. Keep progression internally consistent.</textarea></div><button class="btn primary" onclick="createGame()">Create & Play</button> <button class="btn" onclick="closeModal()">Cancel</button>')}
function createGame(){var g={id:'custom-'+Date.now(),title:document.getElementById('ct').value||'Untitled Realm',genre:document.getElementById('cg').value,icon:'✨',desc:'A custom AI adventure.',premise:document.getElementById('cp').value,playerName:document.getElementById('cn').value,role:document.getElementById('cr').value,setting:'Opening Scene',tone:document.getElementById('co').value,rules:document.getElementById('ci').value,cards:[['Game Overview',document.getElementById('cp').value],['Player',document.getElementById('cn').value+' — '+document.getElementById('cr').value],['AI Instructions',document.getElementById('ci').value]],plays:0,rating:null};db.games.push(g);save();closeModal();play(g.id)}
boot();
</script></body></html>
